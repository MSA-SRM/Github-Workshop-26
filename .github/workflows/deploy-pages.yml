name: Deploy workshop deck to GitHub Pages
on:
  push:
    branches: [feat/web-deck]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: deck/package-lock.json }
      - run: npm ci
        working-directory: deck
      - run: npx vite build --mode pages
        working-directory: deck
      - uses: actions/upload-pages-artifact@v3
        with: { path: deck/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
